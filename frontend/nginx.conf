# Static SPA server for Angular builds. Runs as the unprivileged nginx user on port 8080.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # Hashed build artefacts: cache for a year. index.html: never cache.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|avif|svg|ico|glb|wasm)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}

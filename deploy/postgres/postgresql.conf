# Production tuning for an 8 GB memory limit (adjust with the host). Everything else is default.
listen_addresses = '*'
max_connections = 200
shared_buffers = 2GB
effective_cache_size = 6GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_level = replica
max_wal_size = 2GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
log_min_duration_statement = 500
log_line_prefix = '%m [%p] %u@%d '
timezone = 'UTC'

global: { scrape_interval: 15s }
scrape_configs:
  - job_name: api
    metrics_path: /internal/metrics
    static_configs: [{ targets: ["api:8000"] }]
  - job_name: caddy
    static_configs: [{ targets: ["proxy:2019"] }]
  - job_name: kratos
    metrics_path: /admin/metrics/prometheus
    static_configs: [{ targets: ["kratos:4434"] }]

[project]
name = "unitforma-backend"
version = "0.1.0"
description = "Unitforma backend: API, workers and scheduler (modular monolith)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "procrastinate>=3.0",
  "httpx>=0.27",
  "structlog>=24.4",
  "uuid-utils>=0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
]

[project.scripts]
unitforma = "unitforma.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unitforma"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true

[tool.importlinter]
root_package = "unitforma"

[[tool.importlinter.contracts]]
name = "core does not import feature modules"
type = "forbidden"
source_modules = ["unitforma.core"]
forbidden_modules = ["unitforma.api", "unitforma.identity", "unitforma.tenants", "unitforma.domains", "unitforma.jobs"]

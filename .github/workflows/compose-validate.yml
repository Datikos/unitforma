name: compose
on:
  push: { branches: [main], paths: ["deploy/**", ".github/workflows/compose-validate.yml"] }
  pull_request: { paths: ["deploy/**", ".github/workflows/compose-validate.yml"] }
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create placeholder secrets and env
        run: |
          cd deploy && ./scripts/init-secrets.sh && cd compose && cp .env.example .env
          for f in dns_provider_token backup_rclone_conf backup_age_recipient; do echo placeholder > secrets/$f; done
      - run: cd deploy/compose && docker compose -f compose.yaml -f compose.dev.yaml config --quiet
      - run: cd deploy/compose && docker compose -f compose.yaml -f compose.prod.yaml -f compose.observability.yaml --env-file .env config --quiet
      - name: Only the proxy may publish ports in production
        run: |
          cd deploy/compose
          docker compose -f compose.yaml -f compose.prod.yaml --env-file .env config --format json \
            | python3 -c "import json,sys; d=json.load(sys.stdin); bad=[k for k,v in d['services'].items() if v.get('ports') and k!='proxy']; print('published:',bad); sys.exit(1 if bad else 0)"
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          ignore: "DL3008 DL3018"
          failure-threshold: warning
      - name: Validate Caddyfiles
        run: |
          docker run --rm -v "$PWD/deploy/caddy:/work:ro" --entrypoint /bin/sh caddy:2.11 -c "cp -r /work /tmp/caddy && /tmp/caddy/validate.sh caddy"

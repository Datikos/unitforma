name: frontend
on:
  push: { branches: [main], paths: ["frontend/**", ".github/workflows/ci-frontend.yml"] }
  pull_request: { paths: ["frontend/**", ".github/workflows/ci-frontend.yml"] }
jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx ng test admin --watch=false
      - run: npx ng test portal --watch=false
      - run: npx ng test plan-viewer --watch=false
      - run: npx ng test viewer-3d --watch=false
      - run: npx ng build admin --configuration production
      - run: npx ng build portal --configuration production

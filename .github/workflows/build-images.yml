name: images
on:
  push: { branches: [main], tags: ["v*"] }
  workflow_dispatch:
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend,    context: backend,      file: backend/Dockerfile, target: runtime }
          # heavy worker: same Dockerfile, runtime-ifc target with IfcOpenShell (ADR-0006 Phase C)
          - { name: backend-ifc, context: backend,     file: backend/Dockerfile, target: runtime-ifc }
          - { name: web-admin,  context: frontend,     file: frontend/Dockerfile.admin }
          - { name: web-portal, context: frontend,     file: frontend/Dockerfile.portal }
          - { name: proxy,      context: deploy/caddy, file: deploy/caddy/Dockerfile }
          - { name: backup,     context: deploy/backup, file: deploy/backup/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/unitforma-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
